name: Auto release on manifest version bump

on:
  push:
    branches:
      - main
    paths:
      - custom_components/flightradar24/manifest.json

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: manifest
        run: |
          version=$(jq -r .version custom_components/flightradar24/manifest.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::manifest.json has no 'version' field"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Check whether the tag already exists
        id: tag
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION is new — will create release."
          fi

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.version }}
          name: ${{ steps.manifest.outputs.version }}
          generate_release_notes: true
