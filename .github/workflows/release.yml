name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Write release version into manifest.json
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          yq -i -o json '.version = strenv(TAG_NAME)' \
            custom_components/flightradar24/manifest.json

      - name: Zip the integration directory
        working-directory: custom_components/flightradar24
        run: |
          zip flightradar24.zip -r . \
            -x '*__pycache__*' '*.pyc' '.DS_Store'

      - name: Attach zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/flightradar24/flightradar24.zip
