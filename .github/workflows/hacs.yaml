name: Validate HACS

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # HACS recommends pinning to @main; see https://hacs.xyz/docs/publish/action/
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
